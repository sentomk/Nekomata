name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cc }} / ${{ matrix.preset }} / dwarf=${{ matrix.dwarf }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 defaults: GCC 11 / Clang 14 — Clang 14 is the floor
          # required of the compiler frontend backend.
          - { os: ubuntu-22.04, cc: gcc, cxx: g++, preset: debug, dwarf: "ON" }
          - { os: ubuntu-22.04, cc: clang, cxx: clang++, preset: debug, dwarf: "ON" }
          - { os: ubuntu-24.04, cc: gcc, cxx: g++, preset: debug, dwarf: "ON" }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++, preset: debug, dwarf: "ON" }
          - { os: ubuntu-24.04, cc: gcc, cxx: g++, preset: release, dwarf: "ON" }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++, preset: debug, dwarf: "OFF" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          python3 tools/dev.py configure ${{ matrix.preset }} --
          -DNEKOMATA_ENABLE_DWARF_INSPECTION=${{ matrix.dwarf }}

      - name: Build
        run: python3 tools/dev.py build ${{ matrix.preset }}

      - name: Test
        run: python3 tools/dev.py test ${{ matrix.preset }}

  # The kernel is platform-neutral; building it on macOS keeps it honest.
  # Backend directories are skipped by design on this platform.
  kernel-portability:
    name: kernel-only / macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: python3 tools/dev.py configure debug

      - name: Build
        run: python3 tools/dev.py build debug

      - name: Test
        run: python3 tools/dev.py test debug

  # neko::tui is optional and off by default (turning it on fetches Glyph), so
  # no other job builds it — and it is the one place with a platform layer: a
  # pty and termios, whose behaviour differs between Linux and macOS in ways
  # that fail silently (termios on the master, sizing before the slave
  # exists). Both platforms run it, and the tests drive a real pty rather than
  # a mock, so the platform layer is exercised rather than compiled.
  tui:
    name: tui / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          python3 tools/dev.py configure debug --
          -DNEKOMATA_TUI=ON
          -DNEKOMATA_ENABLE_DWARF_INSPECTION=OFF

      - name: Build the TUI and its tests
        run: python3 tools/dev.py build debug -- --target neko_tui_layout neko_tui_monitor_input

      - name: Test
        run: python3 tools/dev.py test debug -- -R neko.tui

  # Windows has no backend yet (pe/pdb are stubs), so this job covers what
  # does run there: the kernel (log, session, harness, public_api) and
  # neko::tui with the Win32 terminal backend. This is the only Windows
  # coverage in CI — it would have caught the `log.cpp` unistd.h slip.
  windows:
    name: windows / kernel + tui
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Enable the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          python tools/dev.py configure debug --
          -DNEKOMATA_TUI=ON
          -DNEKOMATA_ENABLE_DWARF_INSPECTION=OFF

      - name: Build
        run: python tools/dev.py build debug

      - name: Test
        run: python tools/dev.py test debug

  sanitizers:
    name: sanitizers / ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: python3 tools/dev.py configure asan

      - name: Build
        run: python3 tools/dev.py build asan

      - name: Test
        run: python3 tools/dev.py test asan

  tidy:
    name: clang-tidy / LLVM 18
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18
        run: sudo apt-get update && sudo apt-get install -y clang-18 clang-tidy-18

      - name: Verify clang-tidy configuration
        run: |
          clang-tidy-18 --version
          clang-tidy-18 --verify-config --config-file=.clang-tidy

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: python3 tools/dev.py configure tidy -- -DNEKOMATA_CLANG_TIDY_EXECUTABLE=clang-tidy-18

      - name: Build and analyze
        run: python3 tools/dev.py build tidy

      - name: Test
        run: python3 tools/dev.py test tidy

  format:
    name: clang-format 22
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting with clang-format 22
        run: python3 tools/dev.py format --check

  fuzz:
    name: fuzz burst / libFuzzer, 4 min
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: python3 tools/dev.py configure fuzz

      - name: Build fuzz targets
        run: python3 tools/dev.py build fuzz

      - name: Replay corpus + explore (4 min)
        run: |
          ./build/fuzz/tests/fuzz/fuzz_parse_object tests/fuzz/corpus \
            -max_total_time=240 -rss_limit_mb=2560 -print_final_stats=1

  # The Windows PE/PDB backend and MSVC build matrix are planned work.
