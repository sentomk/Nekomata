name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cc }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 defaults: GCC 11 / Clang 14 — Clang 14 is the floor
          # required of the compiler frontend backend.
          - { os: ubuntu-22.04, cc: gcc, cxx: g++ }
          - { os: ubuntu-22.04, cc: clang, cxx: clang++ }
          - { os: ubuntu-24.04, cc: gcc, cxx: g++ }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++ }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

  # The kernel is platform-neutral; building it on macOS keeps it honest.
  # Backend directories are skipped by design on this platform.
  kernel-portability:
    name: kernel-only / macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: cmake --preset debug

      - name: Build
        run: cmake --build --preset debug

      - name: Test
        run: ctest --preset debug

  sanitizers:
    name: sanitizers / ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Ninja
        run: sudo apt-get update && sudo apt-get install -y ninja-build

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: cmake --preset asan

      - name: Build
        run: cmake --build --preset asan

      - name: Test
        run: ctest --preset asan

  tidy:
    name: clang-tidy / LLVM 18
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18 and Ninja
        run: sudo apt-get update && sudo apt-get install -y clang-18 clang-tidy-18 ninja-build

      - name: Verify clang-tidy configuration
        run: |
          clang-tidy-18 --version
          clang-tidy-18 --verify-config --config-file=.clang-tidy

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: cmake --preset tidy -DNEKOMATA_CLANG_TIDY_EXECUTABLE=clang-tidy-18

      - name: Build and analyze
        run: cmake --build --preset tidy

      - name: Test
        run: ctest --preset tidy

  format:
    name: clang-format
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install clang-format 18
        run: sudo apt-get update && sudo apt-get install -y clang-format-18

      - name: Check formatting
        run: bash scripts/format.sh --check

  # The Windows PE/PDB backend and MSVC build matrix are planned work.
