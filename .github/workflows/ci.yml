name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.cc }} / ${{ matrix.preset }} / dwarf=${{ matrix.dwarf }}
    strategy:
      fail-fast: false
      matrix:
        include:
          # ubuntu-22.04 defaults: GCC 11 / Clang 14 — Clang 14 is the floor
          # required of the compiler frontend backend.
          - { os: ubuntu-22.04, cc: gcc, cxx: g++, preset: debug, dwarf: "ON" }
          - { os: ubuntu-22.04, cc: clang, cxx: clang++, preset: debug, dwarf: "ON" }
          - { os: ubuntu-24.04, cc: gcc, cxx: g++, preset: debug, dwarf: "ON" }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++, preset: debug, dwarf: "ON" }
          - { os: ubuntu-24.04, cc: gcc, cxx: g++, preset: release, dwarf: "ON" }
          - { os: ubuntu-24.04, cc: clang, cxx: clang++, preset: debug, dwarf: "OFF" }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: ${{ matrix.cc }}
          CXX: ${{ matrix.cxx }}
        run: >
          bash scripts/configure.sh ${{ matrix.preset }}
          -DNEKOMATA_ENABLE_DWARF_INSPECTION=${{ matrix.dwarf }}

      - name: Build
        run: bash scripts/build.sh ${{ matrix.preset }}

      - name: Test
        run: bash scripts/test.sh ${{ matrix.preset }}

  wasm:
    name: wasm / Emscripten 6.0.9 / Chrome
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the pinned Emscripten SDK
        uses: actions/checkout@v4
        with:
          repository: emscripten-core/emsdk
          ref: 5eb0bde7585670252e8ba05e9d361627bffd08b5 # 6.0.9
          path: .tools/emsdk

      - name: Install and activate Emscripten
        run: |
          .tools/emsdk/emsdk install 6.0.9
          .tools/emsdk/emsdk activate 6.0.9

      - name: Build and test WASM reload lifecycle in Chrome
        run: |
          source .tools/emsdk/emsdk_env.sh
          em++ --version
          google-chrome --version
          bash scripts/configure.sh debug \
            -DNEKOMATA_TEST_WASM=ON \
            -DNEKOMATA_BUILD_TOOLS=ON \
            -DNEKOMATA_ENABLE_DWARF_INSPECTION=OFF \
            -DNEKOMATA_WASM_BROWSER="$(command -v google-chrome)"
          # Exercise the native managed lifecycle alongside the WASM suites
          # while their public session contracts converge.
          bash scripts/build.sh debug --target neko_wasm_fixtures \
            neko_unit_backends_wasm_candidate \
            neko_unit_backends_wasm_offer_poller \
            neko_unit_backends_wasm_session \
            neko_unit_backends_wasm_registration \
            neko_unit_backends_wasm_plt \
            neko_unit_runtime_session_driver \
            neko_integration_session_lifecycle
          bash scripts/test.sh debug -R '^neko\.((unit\.backends|e2e)\.wasm\.|unit\.runtime\.session_driver$|integration\.session\.lifecycle$)' \
            -E '^neko\.e2e\.wasm\.(session_lifecycle|multi_group_session|public_factory|public_release|empty_registry)$' --no-tests=error
          # Keep the CMake publisher-to-browser acceptance gate explicit.
          bash scripts/test.sh debug -R '^neko\.e2e\.wasm\.session_lifecycle$' --no-tests=error
          bash scripts/test.sh debug -R '^neko\.e2e\.wasm\.multi_group_session$' --no-tests=error
          bash scripts/test.sh debug -R '^neko\.e2e\.wasm\.public_factory$' --no-tests=error
          bash scripts/test.sh debug -R '^neko\.e2e\.wasm\.public_release$' --no-tests=error
          bash scripts/test.sh debug -R '^neko\.e2e\.wasm\.empty_registry$' --no-tests=error

      - name: Preserve test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: wasm-test-log
          path: build/debug/Testing/Temporary/LastTest.log

  # The kernel is platform-neutral; building it on macOS keeps it honest.
  # Backend directories are skipped by design on this platform.
  kernel-portability:
    name: kernel-only / macOS arm64
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: bash scripts/configure.sh debug

      - name: Build
        run: bash scripts/build.sh debug

      - name: Test
        run: bash scripts/test.sh debug

  # neko::tui is optional and off by default (turning it on fetches Glyph), so
  # no other job builds it — and it is the one place with a platform layer: a
  # pty and termios, whose behaviour differs between Linux and macOS in ways
  # that fail silently (termios on the master, sizing before the slave
  # exists). Both platforms run it, and the tests drive a real pty rather than
  # a mock, so the platform layer is exercised rather than compiled.
  tui:
    name: tui / ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-14]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >
          bash scripts/configure.sh debug
          -DNEKOMATA_TUI=ON
          -DNEKOMATA_ENABLE_DWARF_INSPECTION=OFF

      - name: Build the TUI and its tests
        run: bash scripts/build.sh debug --target neko_unit_tui_layout neko_unit_tui_monitor_input

      - name: Test
        run: bash scripts/test.sh debug -L tui

  # This is the only Windows coverage in CI: the kernel suites, the PE
  # backend's in-process pieces (executable memory and entry patching so
  # far), and neko::tui with the Win32 terminal backend — it would have
  # caught the `log.cpp` unistd.h slip.
  windows:
    name: windows / kernel + pe + tui
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Enable the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        run: >
          bash scripts/configure.sh debug
          -DNEKOMATA_TUI=ON
          -DNEKOMATA_ENABLE_DWARF_INSPECTION=OFF

      - name: Build
        run: bash scripts/build.sh debug

      - name: Test
        run: bash scripts/test.sh debug

  # The PE backend supports both Windows driver families: the same COFF
  # objects, decorations, and ABI come out of clang-cl, so the tree must
  # build and pass under it too.
  windows-clang:
    name: windows / clang-cl / kernel + pe
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Enable the MSVC environment
        uses: ilammy/msvc-dev-cmd@v1

      - name: Configure
        env:
          CC: clang-cl
          CXX: clang-cl
        run: >
          bash scripts/configure.sh debug
          -DNEKOMATA_ENABLE_DWARF_INSPECTION=OFF

      - name: Build
        run: bash scripts/build.sh debug

      - name: Test
        run: bash scripts/test.sh debug

  sanitizers:
    name: sanitizers / ASan + UBSan
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        env:
          CC: clang
          CXX: clang++
        run: bash scripts/configure.sh asan

      - name: Build
        run: bash scripts/build.sh asan

      - name: Test
        run: bash scripts/test.sh asan

  tidy:
    name: clang-tidy / LLVM 18
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Install LLVM 18
        run: sudo apt-get update && sudo apt-get install -y clang-18 clang-tidy-18

      - name: Verify clang-tidy configuration
        run: |
          clang-tidy-18 --version
          clang-tidy-18 --verify-config --config-file=.clang-tidy

      - name: Configure
        env:
          CC: clang-18
          CXX: clang++-18
        run: bash scripts/configure.sh tidy -DNEKOMATA_CLANG_TIDY_EXECUTABLE=clang-tidy-18

      - name: Build and analyze
        run: bash scripts/build.sh tidy

      - name: Test
        run: bash scripts/test.sh tidy

  format:
    name: clang-format 22
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Check formatting with clang-format 22
        run: bash scripts/format.sh --check

  fuzz:
    name: fuzz burst / libFuzzer, 4 min
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: bash scripts/configure.sh fuzz

      - name: Build fuzz targets
        run: bash scripts/build.sh fuzz

      - name: Replay corpus + explore (4 min)
        run: |
          ./build/fuzz/tests/fuzz/fuzz_parse_object tests/fuzz/corpus \
            -max_total_time=240 -rss_limit_mb=2560 -print_final_stats=1

  # Growing the PE backend (COFF loader, DIA symbols, live-reload e2e) and
  # the MSVC build matrix is planned work.
