<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Nekomata Flock</title>
  <style>
    :root {
      color-scheme: dark;
      --bg: #0c0e11;
      --text: #d9dee5;
      --muted: #737c88;
      --faint: #2a3038;
      --ok: #7bd88f;
      --bad: #ff6b6b;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0; padding: 28px 16px 40px;
      background: var(--bg); color: var(--text);
      font: 14px/1.55 ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif;
    }
    .stage { max-width: 960px; margin: 0 auto; }
    h1 { margin: 0 0 14px; font-size: 14px; font-weight: 500; }
    h1 span { color: var(--muted); font-weight: 400; }
    canvas {
      display: block; width: 100%; height: auto; aspect-ratio: 960 / 600;
      background: #07080a; border-radius: 6px; cursor: crosshair; touch-action: none;
    }
    .status {
      display: flex; justify-content: space-between; gap: 16px; flex-wrap: wrap;
      margin-top: 12px; font-family: var(--mono); font-size: 13px;
    }
    .status .numbers { color: var(--muted); font-variant-numeric: tabular-nums; }
    #breaches { color: var(--bad); }
    #event { min-height: 1.55em; margin-top: 2px; font-size: 13px; color: var(--muted); }
    #event.ok { color: var(--ok); }
    #event.bad { color: var(--bad); }
    .hint { margin-top: 10px; font-size: 12px; color: var(--muted); }
  </style>
</head>
<body>
<div class="layout">
<main class="stage">
  <h1>nekomata · flock <span>— edit C++, keep the world</span></h1>
  <div class="view">
    <canvas id="world" width="960" height="600"></canvas>
    <div class="status">
      <span id="behavior">starting…</span>
      <span class="numbers"><span id="age">0:00</span> · <span id="breaches">0</span> breaches</span>
    </div>
    <div id="event"></div>
  </div>
  <p class="hint">Drag to draw walls, click to release a flock, press C to clear walls.</p>
</main>
</div>
<script>
  const canvas = document.getElementById('world');
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;

  // Called once per frame with the boid and wall arrays in wasm memory. Boids
  // are drawn in one pale tone so that a breach, in red, is the only color.
  window.flock_render = (f32, boids, count, stride, walls, wallCount) => {
    ctx.fillStyle = 'rgba(7, 8, 10, 0.28)';
    ctx.fillRect(0, 0, W, H);

    ctx.strokeStyle = '#7d8795';
    ctx.lineWidth = 4;
    ctx.lineCap = 'round';
    ctx.beginPath();
    for (let i = 0; i < wallCount; ++i) {
      const w = walls + i * 4;
      ctx.moveTo(f32[w], f32[w + 1]);
      ctx.lineTo(f32[w + 2], f32[w + 3]);
    }
    ctx.stroke();

    ctx.fillStyle = '#d9dee5';
    ctx.beginPath();
    for (let i = 0; i < count; ++i) {
      const b = boids + i * stride;
      const x = f32[b], y = f32[b + 1];
      const angle = Math.atan2(f32[b + 3], f32[b + 2]);
      const c = Math.cos(angle), s = Math.sin(angle);
      ctx.moveTo(x + c * 7, y + s * 7);
      ctx.lineTo(x - c * 4 - s * 3.5, y - s * 4 + c * 3.5);
      ctx.lineTo(x - c * 4 + s * 3.5, y - s * 4 - c * 3.5);
      ctx.closePath();
    }
    ctx.fill();

    ctx.lineWidth = 2;
    for (let i = 0; i < count; ++i) {
      const b = boids + i * stride;
      const flash = f32[b + 4];
      if (flash > 0) {
        ctx.strokeStyle = `rgba(255, 107, 107, ${flash})`;
        ctx.beginPath();
        ctx.arc(f32[b], f32[b + 1], 6 + (1 - flash) * 14, 0, Math.PI * 2);
        ctx.stroke();
      }
    }
  };

  const el = (id) => document.getElementById(id);
  const set = (id, text) => {
    if (el(id).textContent !== text) el(id).textContent = text;
  };
  window.flock_hud = (tick, breaches, behavior) => {
    const seconds = Math.floor(tick / 60);
    set('age', `${Math.floor(seconds / 60)}:${String(seconds % 60).padStart(2, '0')}`);
    set('breaches', String(breaches));
    set('behavior', behavior);
  };

  // The latest reload transaction, in one line; the full reason is a tooltip.
  const show = (ok, text, detail = '') => {
    const line = el('event');
    line.className = ok ? 'ok' : 'bad';
    line.textContent = text;
    line.title = detail;
  };
  // The first generation replaces nothing, so it needs no message.
  let started = false;
  window.flock_event = (event) => {
    if (event.applied) {
      if (started) show(true, 'Switched at the next frame. Nothing was reset.');
      started = true;
    } else {
      show(false, `Rejected (${event.code}). Still running ${event.behavior}.`, event.message);
    }
  };

  // A trap in behavior code stops the frame loop; say so instead of freezing silently.
  window.addEventListener('error', (e) => show(false, `Page stopped: ${e.message}`));
</script>
<script src="main.js"></script>
</body>
</html>
