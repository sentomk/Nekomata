<!doctype html>
<meta charset="utf-8">
<title>Nekomata WASM test fixture</title>
<script>
  let reported = false;
  window.report_result = (result) => {
    if (reported) return;
    reported = true;
    document.body.textContent = JSON.stringify(result);
    fetch("/result", {method: "POST", body: JSON.stringify(result)});
  };
  window.addEventListener("error", (event) =>
    window.report_result({ok: false, message: event.message}));
  window.addEventListener("unhandledrejection", (event) =>
    window.report_result({ok: false, message: String(event.reason)}));
  var Module = {
    onAbort: (reason) => window.report_result({ok: false, message: String(reason)})
  };
</script>
<body><script src="runner.js"></script></body>
